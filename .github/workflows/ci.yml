name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Two platforms: the committed golden files (engine outputs, sim world
        # and comparison) must reproduce byte for byte on each.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Type-check and test (fails if any golden file differs)
        run: pnpm test
      - run: pnpm build
      - name: Conformance cases against the built CLI
        run: node conformance/check.mjs
      - name: No generated file changed
        run: git diff --exit-code
